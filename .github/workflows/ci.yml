name: Full CI Suite

on:
  push:
    branches: [production, staging, sprint-*]
  pull_request:
    branches: [production, staging]

jobs:
  validate-docker:
    name: Docker Configuration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config

  backend-suite:
    name: Backend Lint, Checks & Tests
    runs-on: ubuntu-latest
    services:
      postgres-primary:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_primary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_primary"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-market-data:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_market_data
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_market_data"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-test-secret-key-not-for-production
      PYTHONPATH: .
      CI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/portfolio_primary
      CI_TEST_MARKET_DATA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/portfolio_market_data

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Django System Checks
        run: python manage.py check

      - name: Verify Migration Consistency
        run: |
          python manage.py migrate --database default
          python manage.py migrate --database market_data
          python manage.py makemigrations --check --dry-run

      - name: Run Pytest Test Suite
        run: pytest -v

  frontend-suite:
    name: Frontend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Type Checking
        run: npm run typecheck

      - name: Run Vitest Suite
        run: npm run test

      - name: Build Production Bundle
        run: npm run build
