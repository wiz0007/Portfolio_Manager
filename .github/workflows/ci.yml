name: Full CI Suite

on:
  push:
    branches: [production, staging, sprint-*]
  pull_request:
    branches: [production, staging]

jobs:
  validate-docker:
    name: Docker Configuration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config

  backend-suite:
    name: Backend Lint, Checks & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      CI_TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/ci_test_db
      SECRET_KEY: ci-test-secret-key-not-for-production
      PYTHONPATH: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements/*.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/development.txt

      - name: Run Ruff Linter
        run: ruff check backend

      - name: Run Django System Checks
        run: python backend/manage.py check

      - name: Verify Migration Consistency
        run: |
          python backend/manage.py migrate
          python backend/manage.py makemigrations --check --dry-run

      - name: Run Pytest Test Suite
        run: pytest backend

  frontend-suite:
    name: Frontend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npm run typecheck

      - name: Run Vitest Suite
        run: npm run test

      - name: Build Production Bundle
        run: npm run build
