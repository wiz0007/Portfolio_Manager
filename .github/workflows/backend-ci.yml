name: Backend CI

on:
  push:
    branches: [production, staging]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [production, staging]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-check:
    runs-on: ubuntu-latest
    services:
      postgres-primary:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_primary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_primary"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-market-data:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_market_data
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_market_data"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-test-secret-key-not-for-production
      PYTHONPATH: .
      CI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/portfolio_primary
      CI_TEST_MARKET_DATA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/portfolio_market_data

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements/development.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Lint and format check (Ruff)
        run: ruff check .

      - name: Verify missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run unit & API tests (Pytest)
        run: pytest -v
